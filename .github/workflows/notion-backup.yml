name: Notion backup

on:
  schedule:
    - cron: '34 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Back up and verify stamp records
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          DOZANG_BACKUP_CONFIG: ${{ secrets.DOZANG_BACKUP_CONFIG }}
        run: node --experimental-strip-types scripts/notion-backup.mjs
